<section class="card scan-card review-card"><ol class="stepper"><li class="done"><span>✓</span>Zajem</li><li class="active"><span>2</span>Pregled</li><li><span>3</span>Potrditev</li></ol><div class="review-heading"><div><span class="eyebrow">AI predlog</span><h2>Preverite podatke</h2></div><span class="confidence">Zanesljivost {{(data.confidence*100)|round|int}} %</span></div><p class="muted">AI se lahko zmoti. Posebej preverite model in serijsko številko.</p><form method="post" action="/assets"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><input type="hidden" name="scan_flow" value="1">{% for attachment in attachments %}<input type="hidden" name="attachment_id" value="{{attachment.id}}">{% endfor %}<div class="form-grid"><label>Naziv*<input name="name" required value="{{data.name}}"></label><label>Kategorija<input name="category" list="categories" value="{{data.category}}"></label><label>Proizvajalec<input name="manufacturer" value="{{data.manufacturer}}"></label><label>Model<input name="model" value="{{data.model}}"></label><label>Serijska številka<input name="serial_number" value="{{data.serial_number}}"></label><label>Lokacija<input name="location" list="locations"></label></div><label>Opombe<textarea name="notes">{{data.notes}}</textarea></label><input type="hidden" name="status" value="in_use"><div class="scan-actions"><button class="button primary">Potrdi in shrani</button><a class="button secondary" href="/assets/scan">Ponovi fotografiranje</a></div></form></section>

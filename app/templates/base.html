<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HAM{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
  <script src="{{ url_for('static', path='/vendor/htmx.min.js') }}" defer></script>
</head>
<body>
  <header class="navbar"><div class="container"><a href="/">HAM</a>{% if request.session.get('uid') %}<form method="post" action="/logout" class="logout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit">Odjava</button></form>{% else %}<span>Home Assets Management</span>{% endif %}</div></header>
  <main class="container">{% block content %}{% endblock %}</main>
</body>
</html>

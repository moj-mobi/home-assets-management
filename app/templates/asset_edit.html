{% extends "base.html" %}{% block content %}<section class="hero"><h1>Uredi {{asset.name}}</h1></section><section class="card">{% include "asset_form.html" %}</section><section class="card"><h2>Priloge</h2><ul>{% for attachment in asset.attachments %}<li><a href="/attachments/{{attachment.id}}">{{attachment.original_name}}</a> — {{attachment.document_type}} <form class="inline" method="post" action="/attachments/{{attachment.id}}/delete"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><button class="danger">Odstrani</button></form></li>{% else %}<li class="muted">Ni prilog.</li>{% endfor %}</ul><form method="post" action="/assets/{{asset.id}}/attachments" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><div class="form-grid"><label>Vrsta<select name="document_type"><option value="invoice">račun</option><option value="warranty">garancijski list</option><option value="photo">fotografija</option><option value="manual">navodila</option><option value="other">drugo</option></select></label><label>Datoteka<input type="file" name="document" required></label></div><button>Dodaj prilogo</button></form></section>{% endblock %}

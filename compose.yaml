services:
  ham:
    build: .
    container_name: ham
    restart: unless-stopped
    user: "${HAM_UID:-1000}:${HAM_GID:-1000}"
    ports:
      - "${HAM_BIND_ADDRESS:-127.0.0.1}:${HAM_HOST_PORT:-8000}:8000"
    environment:
      HAM_DATA_DIR: /app/data
      HAM_ENV: server
      HAM_SESSION_SECRET: ${HAM_SESSION_SECRET:?HAM_SESSION_SECRET is required}
      HAM_SECURE_COOKIES: ${HAM_SECURE_COOKIES:-false}
      HAM_SESSION_MAX_AGE_SECONDS: ${HAM_SESSION_MAX_AGE_SECONDS:-1800}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
